name: Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Resolve app version
        id: version
        run: |
          REF_NAME="${GITHUB_REF_NAME}"
          VERSION_NAME=$(grep -E '^val defaultVersionName' app/build.gradle.kts | sed -E 's/.*"([^"]+)".*/\1/')
          VARIANT="Debug"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          if [[ "${REF_NAME}" == android-v* ]]; then
            VERSION_NAME="${REF_NAME#android-v}"
            VARIANT="Release"
            APK_PATH="app/build/outputs/apk/release/app-release.apk"
          fi
          BASE_SEMVER="${VERSION_NAME%%-*}"
          VERSION_NAME="${BASE_SEMVER}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "${BASE_SEMVER}"
          MAJOR="${MAJOR:-0}"
          MINOR="${MINOR:-0}"
          PATCH="${PATCH:-0}"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          if [[ ${VERSION_CODE} -lt 1 ]]; then
            VERSION_CODE=1
          fi
          echo "name=${VERSION_NAME}" >> "${GITHUB_OUTPUT}"
          echo "code=${VERSION_CODE}" >> "${GITHUB_OUTPUT}"
          echo "variant=${VARIANT}" >> "${GITHUB_OUTPUT}"
          echo "apk_path=${APK_PATH}" >> "${GITHUB_OUTPUT}"

      - name: Build APK
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [[ "${{ steps.version.outputs.variant }}" == "Release" ]]; then
            if [[ -z "${RELEASE_KEYSTORE_BASE64}" || -z "${RELEASE_STORE_PASSWORD}" || -z "${RELEASE_KEY_ALIAS}" || -z "${RELEASE_KEY_PASSWORD}" ]]; then
              echo "Release tags require RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD, RELEASE_KEY_ALIAS and RELEASE_KEY_PASSWORD secrets." >&2
              exit 1
            fi
            echo "${RELEASE_KEYSTORE_BASE64}" | base64 --decode > release.keystore
            export RELEASE_STORE_FILE="${PWD}/release.keystore"
          fi
          ./gradlew assemble${{ steps.version.outputs.variant }} --no-daemon \
            -PappVersionName="${{ steps.version.outputs.name }}" \
            -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Prepare artifact
        run: |
          mkdir -p build-artifacts
          cp "${{ steps.version.outputs.apk_path }}" build-artifacts/prywatny-portfel-mobile.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: prywatny-portfel-mobile-apk
          path: build-artifacts/prywatny-portfel-mobile.apk
          retention-days: 30

  release-apk:
    if: startsWith(github.ref, 'refs/tags/android-v')
    needs: build-apk
    runs-on: ubuntu-latest
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: prywatny-portfel-mobile-apk
          path: dist

      - name: Publish GitHub Release asset
        uses: softprops/action-gh-release@v2
        with:
          files: dist/prywatny-portfel-mobile.apk
          generate_release_notes: true
